spring:
  application:
    name: item-management-system
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Only the loopback NGINX proxy may supply the client address. Any other
      # peer keeps its own socket address and its forwarded headers are ignored.
      internal-proxies: '127\.\d{1,3}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1'
      # NGINX does not overwrite these headers, so they must not be processed.
      host-header: ''
      port-header: ''

app:
  jwt:
    secret: ${JWT_SECRET:ims-dev-secret-key-change-me-0123456789-abcdefghijklmnopqrstuvwxyz}
    expiration-ms: ${JWT_EXPIRATION_MS:43200000}
  embedded-postgres:
    enabled: ${EMBEDDED_POSTGRES:true}
    port: ${EMBEDDED_POSTGRES_PORT:54329}
    data-dir: ${EMBEDDED_POSTGRES_DATA_DIR:./.pgdata}
    database: item_management_db
    clean: ${EMBEDDED_POSTGRES_CLEAN:false}
  seed-demo: ${SEED_DEMO:false}
  build:
    git-commit: ${GIT_COMMIT:unknown}
  auth:
    cookie-name: ${AUTH_COOKIE_NAME:ims_auth}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Strict}
    login-max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    login-window-seconds: ${LOGIN_WINDOW_SECONDS:900}
    login-lockout-seconds: ${LOGIN_LOCKOUT_SECONDS:900}
    login-ip-max-attempts: ${LOGIN_IP_MAX_ATTEMPTS:20}
    login-ip-window-seconds: ${LOGIN_IP_WINDOW_SECONDS:900}
    login-ip-lockout-seconds: ${LOGIN_IP_LOCKOUT_SECONDS:900}
    login-max-tracked-keys: ${LOGIN_MAX_TRACKED_KEYS:10000}
    login-state-cleanup-ms: ${LOGIN_STATE_CLEANUP_MS:300000}
    pairing-max-attempts: ${PAIRING_MAX_ATTEMPTS:10}
    pairing-window-seconds: ${PAIRING_WINDOW_SECONDS:60}
    pairing-lockout-seconds: ${PAIRING_LOCKOUT_SECONDS:300}
    blacklist-cleanup-ms: ${TOKEN_BLACKLIST_CLEANUP_MS:3600000}
  platform-admin:
    provision: ${PROVISION_PLATFORM_ADMIN:false}
    username: ${PLATFORM_ADMIN_USERNAME:}
    password: ${PLATFORM_ADMIN_PASSWORD:}
    email: ${PLATFORM_ADMIN_EMAIL:}
    full-name: ${PLATFORM_ADMIN_FULL_NAME:Platform Administrator}
    mobile: ${PLATFORM_ADMIN_MOBILE:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}

logging:
  level:
    com.itemmanagement: INFO
    io.zonky: WARN

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/item_management_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:15}

app:
  jwt:
    secret: ${JWT_SECRET}
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
  embedded-postgres:
    enabled: false
