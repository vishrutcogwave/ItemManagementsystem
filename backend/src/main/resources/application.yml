spring:
  application:
    name: item-management-system
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET:ims-dev-secret-key-change-me-0123456789-abcdefghijklmnopqrstuvwxyz}
    expiration-ms: ${JWT_EXPIRATION_MS:43200000}
  embedded-postgres:
    enabled: ${EMBEDDED_POSTGRES:true}
    port: ${EMBEDDED_POSTGRES_PORT:54329}
    data-dir: ${EMBEDDED_POSTGRES_DATA_DIR:./.pgdata}
    database: item_management_db
    clean: ${EMBEDDED_POSTGRES_CLEAN:false}
  seed-demo: ${SEED_DEMO:true}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}

logging:
  level:
    com.itemmanagement: INFO
    io.zonky: WARN

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/item_management_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:15}

app:
  embedded-postgres:
    enabled: false
