plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.9'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.itemmanagement'
version = '1.0.0'

def gitCommit = providers.exec {
    commandLine 'git', 'rev-parse', '--short', 'HEAD'
    ignoreExitValue = true
}.standardOutput.asText.map { it.trim() }.getOrElse('')

springBoot {
    buildInfo {
        properties {
            additional = [
                    'git.commit': gitCommit ?: 'unknown'
            ]
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    jjwtVersion = '0.12.6'
    embeddedPostgresVersion = '2.0.7'
    set('commons-lang3.version', '3.20.0')
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    implementation "io.zonky.test:embedded-postgres:${embeddedPostgresVersion}"

    implementation 'org.apache.poi:poi-ooxml:5.5.1'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.apache.httpcomponents.client5:httpclient5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // Bound the number of live embedded PostgreSQL servers in integration tests.
    systemProperty 'spring.test.context.cache.maxSize', '4'
    systemProperty 'server.shutdown', 'immediate'
    systemProperty 'ims.test.repositoryDir', rootProject.projectDir.parentFile.absolutePath
    doFirst {
        // Each run gets fresh relative PostgreSQL paths, even if a prior run was interrupted.
        workingDir java.nio.file.Files.createTempDirectory(temporaryDir.toPath(), 'ims-run-').toFile()
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}
